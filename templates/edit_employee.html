
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee | EMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <h2>EMS</h2>
            <p>Employee Management</p>
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>

            <a href="{{ url_for('employees') }}" class="active">
                Manage Employees
            </a>

            <a href="{{ url_for('profile') }}">My Profile</a>
        </nav>

        <div class="sidebar-bottom">
            <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit" class="logout-btn">
                    Logout
                </button>
            </form>
        </div>

    </aside>


    <!-- Main Content -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <h1>Edit Employee Details</h1>
                <p>Update the employee information below.</p>
            </div>
        </header>


        <!-- Edit Form -->
        <section class="employee-section">

            <div class="section-heading">
                <div>
                    <h2>Employee Information</h2>
                    <p>Modify the details and save your changes.</p>
                </div>
            </div>

            <form method="POST" class="employee-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Employee Name</label>
                        <input type="text"
                               name="name"
                               value="{{ employee.name }}"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email"
                               name="email"
                               value="{{ employee.email }}"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text"
                               name="phone"
                               value="{{ employee.phone or '' }}">
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <input type="text"
                               name="department"
                               value="{{ employee.department or '' }}">
                    </div>

                    <div class="form-group">
                        <label>Designation</label>
                        <input type="text"
                               name="designation"
                               value="{{ employee.designation or '' }}">
                    </div>

                    <div class="form-group">
                        <label>Salary (₹)</label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               name="salary"
                               value="{{ employee.salary if employee.salary is not none else '' }}">
                    </div>

                    <div class="form-group">
                        <label>Joining Date</label>
                        <input type="date"
                               name="joining_date"
                               value="{{ employee.joining_date.strftime('%Y-%m-%d') if employee.joining_date else '' }}">
                    </div>

                </div>

                <div class="edit-actions">

                    <button type="submit" class="primary-btn">
                        Update Employee
                    </button>

                    <a href="{{ url_for('employees') }}"
                       class="secondary-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
